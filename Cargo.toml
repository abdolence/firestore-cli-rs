[package]
name = "firestore-cli"
version = "0.1.2"
authors = ["Abdulla Abdurakhmanov <me@abdolence.dev>"]
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
description = "fsq, a command line client for Google Firestore: a SQL REPL with tables, query plans and index statements, and a scripting mode with JSON output"
homepage = "https://github.com/abdolence/firestore-cli-rs"
repository = "https://github.com/abdolence/firestore-cli-rs"
readme = "README.md"
keywords = ["firestore", "google", "sql", "repl", "cli"]
categories = ["command-line-utilities"]
include = ["Cargo.toml", "src/**/*.rs", "README.md", "LICENSE"]

[[bin]]
name = "fsq"
path = "src/main.rs"

[dependencies]
firestore = { version = "0.66", default-features = false, features = ["tls-webpki-roots", "auth-default-crypto", "sql", "admin", "json-conversion", "codegen"] }
clap = { version = "4.6", features = ["derive"] }
# custom_styling measures cells by their visible width, so that coloured values line up.
comfy-table = { version = "8", features = ["custom_styling"] }
console = "0.16"
# event-stream lets the browser wait for a key and for Firestore at once, and osc52 lets it copy
# to the terminal's clipboard. 0.29 is the version ratatui and reedline use.
crossterm = { version = "0.29", features = ["event-stream", "osc52"] }
dirs = "7"
futures = "0.3"
indicatif = "0.18"
nu-ansi-term = "0.50"
# The crossterm backend of 0.30 uses crossterm 0.29, the version reedline uses.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# reedline 0.50 and later need Rust 1.95.
reedline = "0.49"
# preserve_order keeps the columns of a JSON row in the order of the table's columns.
sqlparser = { version = "0.64", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shlex = "2"
# Breaking at spaces is enough for the browser's error lines; the default line breaking pulls in
# the ICU segmenter.
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Runs tests/live.rs against the Enterprise edition database named by GCP_PROJECT and
# GCP_ENTERPRISE_DATABASE_ID, with the application default credentials.
ci-live = []

[lints.clippy]
mod_module_files = "deny"
unwrap_used = "deny"
